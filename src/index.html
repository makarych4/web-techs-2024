<html lang="ru">
<head>

<body>
<div>
    <h3>Выбирите пиццу</h3>

</div>

<div>
    <h3>Выбирите размер</h3>
    <button onclick="selectSize('Маленькая')">Маленькая</button>
    <button onclick="selectSize('Большая')">Большая</button>

</div>

<div>
    <br>
    <h3>Добавить по вкусу</h3>
    <button onclick="toggleTopping('сливочная моцарелла', this)">Сливочная моцарелла</button>
    <button onclick="toggleTopping('сырный борт', this)">Сырный бортик</button>
    <button onclick="toggleTopping('чедер и пармезан', this)">Чеддер и пармезан</button>
</div>

<div class="basket_button">
    <br><br>
    <button id="basket_button" style="font-size: 25px; background-color: orange; border-radius: 15px;">Добавить в корзину за  </button>
